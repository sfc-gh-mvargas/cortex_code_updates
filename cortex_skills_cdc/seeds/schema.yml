version: 2

seeds:
  - name: raw_skills_mock
    description: "Mock data for CI testing with 2 ingestion dates to validate CDC logic"
    config:
      schema: UPDATES
      column_types:
        skill_name: varchar(256)
        skill_description: varchar(16384)
        skill_type: varchar(64)
        skill_path: varchar(4096)
        cli_version: varchar(64)
        captured_at: timestamp_ntz
        ingestion_date: date
