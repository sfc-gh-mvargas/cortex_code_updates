version: 2

sources:
  - name: raw_skills
    database: "{{ var('source_database') }}"
    schema: UPDATES
    tables:
      - name: CORTEX_CLI_BUNDLED_SKILLS_LOG
        description: "Append-only bronze table capturing all Cortex CLI skills per ingestion run"
        columns:
          - name: SKILL_NAME
            description: "Unique skill identifier"
          - name: SKILL_DESCRIPTION
            description: "Full description from SKILL.md frontmatter"
          - name: SKILL_TYPE
            description: "BUNDLED, REMOTE, or EXTERNAL"
          - name: SKILL_PATH
            description: "Local filesystem path to the skill"
          - name: CLI_VERSION
            description: "Cortex CLI version at capture time"
          - name: CAPTURED_AT
            description: "Timestamp of ingestion"
          - name: INGESTION_DATE
            description: "Date of ingestion"
