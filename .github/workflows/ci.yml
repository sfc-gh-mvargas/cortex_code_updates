name: Ingest Cortex CLI Skills

on:
  schedule:
    - cron: '0 12 * * 1'  # Every Monday at noon UTC
  workflow_dispatch:
g
permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv pip install pyyaml --system

      # - name: Create connections.toml
      #   run: |
      #     mkdir -p ~/.snowflake
      #     cat <<EOF > ~/.snowflake/connections.toml
      #     [default]
      #     account = "${{ secrets.SNOWFLAKE_ACCOUNT }}"
      #     user = "${{ secrets.SNOWFLAKE_USER }}"
      #     password = "${{ secrets.SNOWFLAKE_PASSWORD }}"
      #     EOF
      #     chmod 600 ~/.snowflake/connections.toml


      - name: Install Cortex Code CLI
        run: |
          curl -fsSL https://downloads.snowflake.com/cortex/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/bin:$PATH"
          # Verify installation
          if ! command -v cortex &> /dev/null; then
            echo "Cortex CLI installation failed"
            exit 1
          fi
          cortex --version

      - name: Run ingestion
        run: uv run python src/ingest_skills.py

      - name: Generate email report
        run: uv run python src/build_report.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ report/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update skills snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
