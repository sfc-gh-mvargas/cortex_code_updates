name: Ingest Cortex CLI Skills

on:
  workflow_dispatch:


permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv pip install pyyaml --system

      - name: Install Cortex Code CLI (stable)
        run: |
          curl -LsS https://ai.snowflake.com/static/cc-scripts/install.sh | sh
          if ! command -v cortex &> /dev/null; then
            echo "Cortex CLI installation failed"
            exit 1
          fi
          cortex --version

      - name: Verify ~/.local/share/cortex is populated (stable)
        run: |
          CORTEX_DIR="$HOME/.local/share/cortex"
          if [ ! -d "$CORTEX_DIR" ]; then
            echo "ERROR: $CORTEX_DIR does not exist"
            exit 1
          fi
          VERSION_DIRS=$(find "$CORTEX_DIR" -mindepth 1 -maxdepth 1 -type d | head -5)
          if [ -z "$VERSION_DIRS" ]; then
            echo "ERROR: $CORTEX_DIR has no version directories"
            exit 1
          fi
          echo "Found version directories:"
          echo "$VERSION_DIRS"
          SKILLS_FOUND=false
          for dir in $VERSION_DIRS; do
            if [ -d "$dir/bundled_skills" ]; then
              SKILL_COUNT=$(find "$dir/bundled_skills" -mindepth 1 -maxdepth 1 -type d | wc -l)
              echo "  $dir/bundled_skills: $SKILL_COUNT skills"
              SKILLS_FOUND=true
            fi
          done
          if [ "$SKILLS_FOUND" = false ]; then
            echo "ERROR: No bundled_skills directory found in any version folder"
            exit 1
          fi

      - name: Run ingestion (stable)
        run: uv run python src/ingest_skills.py

      - name: Generate CDC docs (stable)
        run: uv run python src/build_report.py

      - name: Run ingestion (plugins)
        run: uv run python src/ingest_plugins.py

      - name: Generate CDC docs (plugins)
        run: uv run python src/build_report.py --plugins

      - name: Install Cortex Code CLI (beta)
        run: |
          curl -LsS https://ai.snowflake.com/static/cc-scripts/install.sh | CORTEX_CHANNEL=beta sh
          cortex --version

      - name: Verify ~/.local/share/cortex is populated (beta)
        run: |
          CORTEX_DIR="$HOME/.local/share/cortex"
          VERSION_DIRS=$(find "$CORTEX_DIR" -mindepth 1 -maxdepth 1 -type d | head -5)
          if [ -z "$VERSION_DIRS" ]; then
            echo "ERROR: $CORTEX_DIR has no version directories after beta install"
            exit 1
          fi
          echo "Version directories after beta install:"
          echo "$VERSION_DIRS"
          SKILLS_FOUND=false
          for dir in $VERSION_DIRS; do
            if [ -d "$dir/bundled_skills" ]; then
              SKILL_COUNT=$(find "$dir/bundled_skills" -mindepth 1 -maxdepth 1 -type d | wc -l)
              echo "  $dir/bundled_skills: $SKILL_COUNT skills"
              SKILLS_FOUND=true
            fi
          done
          if [ "$SKILLS_FOUND" = false ]; then
            echo "ERROR: No bundled_skills directory found after beta install"
            exit 1
          fi

      - name: Ensure beta baseline exists
        run: |
          mkdir -p data/beta
          if ! ls data/beta/skills_v*.json 1>/dev/null 2>&1; then
            echo "No beta baseline found, seeding from latest stable snapshot"
            LATEST=$(ls data/skills_v*.json | sort | tail -1)
            cp "$LATEST" "data/beta/$(basename $LATEST)"
          fi

      - name: Run ingestion (beta)
        run: uv run python src/ingest_skills.py --beta

      - name: Generate CDC docs (beta)
        run: uv run python src/build_report.py --beta

      - name: Ensure plugins beta baseline exists
        run: |
          mkdir -p data/plugins/beta
          if ! ls data/plugins/beta/plugins_v*.json 1>/dev/null 2>&1; then
            echo "No plugins beta baseline found, seeding from latest stable plugin snapshot"
            LATEST=$(ls data/plugins/plugins_v*.json | sort | tail -1)
            cp "$LATEST" "data/plugins/beta/$(basename $LATEST)"
          fi

      - name: Run ingestion (plugins beta)
        run: uv run python src/ingest_plugins.py --beta

      - name: Generate CDC docs (plugins beta)
        run: uv run python src/build_report.py --plugins-beta

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update skills snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
